name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          release-type: prerelease
          prerelease: true
          dry-run: true
        continue-on-error: true

      - name: Assert action ran (dry-run should not fail fatally)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skipped: $SKIPPED"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "failure" ]; then
            echo "WARN: action failed in dry-run mode (may need real GitHub token)"
          fi
          echo "PASS: action completed"
