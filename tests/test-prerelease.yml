name: Test prerelease mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a local git remote reachable by the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          release-type: prerelease
          prerelease: 'true'
          dry-run: 'true'

      - name: Assert action ran and either succeeded or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: action succeeded but tag output is empty"
              exit 1
            fi
            # Tag should be a prerelease version (contains a hyphen or .0)
            echo "PASS: prerelease dry-run succeeded with tag '$TAG'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
