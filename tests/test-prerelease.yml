name: Test prerelease release type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Ensure package.json exists with a version
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"test-package","version":"1.0.0"}' > package.json
            git add package.json
            git commit -m "chore: add package.json for test" || true
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          release-type: prerelease
          prerelease: true
          dry-run: true

      - name: Assert action ran (prerelease or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TAG: ${{ steps.action.outputs.tag }}
          SKIPPED: ${{ steps.action.outputs.skipped }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in prerelease dry-run mode (tag=$TAG)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
