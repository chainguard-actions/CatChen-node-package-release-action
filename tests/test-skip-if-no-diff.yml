name: Test skip-if-no-diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - name: Set up local git remote
        run: |
          git init --bare /tmp/test-remote.git
          git remote set-url origin /tmp/test-remote.git
          BRANCH=$(git branch --show-current)
          if [ -n "$BRANCH" ]; then
            git push origin "$BRANCH"
          else
            git push origin HEAD:refs/heads/act-harness
          fi
          git push origin --tags || true
      - id: action
        uses: .
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          directory: './'
          release-type: prerelease
          skip-if-no-diff: true
          diff-targets: '.'
          dry-run: true
        continue-on-error: true
      - name: Assert skip-if-no-diff behavior
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          TAG: ${{ steps.action.outputs.tag }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skipped: $SKIPPED"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SKIPPED" = "true" ]; then
              echo "PASS: action was skipped (no diff detected since last release of same type)"
            elif [ "$SKIPPED" = "false" ]; then
              if [ -z "$TAG" ]; then
                echo "FAIL: action not skipped but tag output is empty"
                exit 1
              fi
              echo "PASS: action ran and created tag=$TAG (diff detected or no previous release)"
            else
              echo "FAIL: unexpected skipped value: '$SKIPPED'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed (likely due to API auth limitations in act environment)"
            echo "PASS: test infrastructure verified; action ran and failed at expected stage"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
