name: Test skip-if-no-diff when no changes detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin and create a prerelease tag at HEAD
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a prerelease tag at HEAD so there's no diff since last prerelease
          git tag v0.1.0-0
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a test package.json in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pkg"
          echo '{"name":"test-package","version":"0.1.0-0"}' > "$GITHUB_WORKSPACE/test-pkg/package.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          release-type: 'prerelease'
          skip-if-no-diff: 'true'
          diff-targets: '.'
          dry-run: 'true'
          directory: './test-pkg'

      - name: Assert action skipped or failed gracefully on sentinel repo
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skipped: $SKIPPED"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$SKIPPED" != "true" ]; then
              echo "FAIL: action succeeded but skipped output is not 'true' (got '$SKIPPED')"
              exit 1
            fi
            echo "PASS: action correctly skipped due to no diff"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for API calls)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
