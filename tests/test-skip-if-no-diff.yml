name: Test skip-if-no-diff input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable from Node action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          release-type: prerelease
          skip-if-no-diff: 'true'
          diff-targets: '.'
          dry-run: 'true'

      - name: Assert action ran with skip-if-no-diff enabled
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          TAG: ${{ steps.action.outputs.tag }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skipped: $SKIPPED"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            # If action succeeded, either it was skipped or it produced a tag
            if [ "$SKIPPED" = "true" ]; then
              echo "PASS: action was skipped due to no diff"
            elif [ -n "$TAG" ]; then
              echo "PASS: action ran and produced tag '$TAG' (no previous same-type release to compare)"
            else
              echo "FAIL: action succeeded but neither skipped nor produced a tag"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
