name: Test skip-if-no-diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable from the Node action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          release-type: prerelease
          dry-run: 'true'
          prerelease: 'true'
          skip-if-no-diff: 'true'
          diff-targets: '.'

      - name: Assert action ran (skipped output set or failed gracefully on sentinel repo)
        env:
          SKIPPED: ${{ steps.action.outputs.skipped }}
          TAG: ${{ steps.action.outputs.tag }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "skipped: $SKIPPED"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            # When there's no prior release of the same type, skipped should be false
            # and tag should be set
            if [ "$SKIPPED" = "true" ]; then
              echo "PASS: action skipped (no diff detected)"
            elif [ -n "$TAG" ]; then
              echo "PASS: action proceeded with tag '$TAG' (skipped=false)"
            else
              echo "FAIL: action succeeded but neither skipped=true nor tag set"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
